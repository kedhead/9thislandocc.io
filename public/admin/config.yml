backend:
  name: github
  repo: kedhead/9thislandocc.io
  branch: main
  base_url: https://9thislandoutrigger.com
  auth_endpoint: /api/oauth/authorize

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Events & News"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["race", "event", "practice", "news"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "src/content/pages/about.mdx"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "site"
        file: "src/content/settings/site.json"
        fields:
          - {label: "Site Name", name: "siteName", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Contact Email", name: "contactEmail", widget: "string"}
          - {label: "Facebook URL", name: "facebookUrl", widget: "string"}
          - {label: "Instagram URL", name: "instagramUrl", widget: "string"}

      - label: "Practice Schedule"
        name: "practice"
        file: "public/data/practice.json"
        fields:
          - label: "Weekday Practices"
            name: "weekday"
            widget: "list"
            fields:
              - {label: "Day", name: "day", widget: "string"}
              - {label: "Time", name: "time", widget: "string"}
          - label: "Weekend Practices"
            name: "weekend"
            widget: "list"
            fields:
              - {label: "Day", name: "day", widget: "string"}
              - {label: "Time", name: "time", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Location Details", name: "locationDetails", widget: "text"}
          - {label: "Street Address", name: "address", widget: "string"}
          - {label: "Directions Heading", name: "directionsFrom", widget: "string"}
          - {label: "Driving Directions", name: "directions", widget: "text"}
          - {label: "Map Search Query (address or lat,long)", name: "mapQuery", widget: "string", required: false}
          - {label: "Map Zoom Level", name: "mapZoom", widget: "number", required: false, value_type: "int", min: 8, max: 20}
          - {label: "Seasonal Note", name: "seasonalNote", widget: "text", required: false}

      - label: "Membership Pricing"
        name: "membership"
        file: "public/data/membership.json"
        fields:
          - label: "Membership Tiers"
            name: "tiers"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Price Note (e.g. late fee)", name: "priceNote", widget: "string", required: false}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Benefits"
                name: "benefits"
                widget: "list"
                field: {label: "Benefit", name: "benefit", widget: "string"}

          - label: "How to Join"
            name: "joining"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Visitor Heading", name: "visitorTitle", widget: "string"}
              - {label: "Visitor Note", name: "visitorNote", widget: "text"}
              - {label: "SCORA SmartWaiver URL", name: "smartwaiverUrl", widget: "string"}
              - {label: "Steps Heading", name: "stepsTitle", widget: "string"}
              - label: "Required Steps"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "Step Name", name: "name", widget: "string"}
                  - {label: "Detail", name: "detail", widget: "text"}
                  - {label: "Link URL", name: "url", widget: "string", required: false}
                  - {label: "Link Label", name: "linkLabel", widget: "string", required: false}
              - {label: "Dues Heading", name: "duesTitle", widget: "string"}
              - {label: "Dues Intro", name: "duesIntro", widget: "text"}
              - {label: "Fee Note", name: "feeNote", widget: "text", required: false}
              - label: "Payment Options"
                name: "duesOptions"
                widget: "list"
                fields:
                  - {label: "Method", name: "method", widget: "string"}
                  - {label: "Detail", name: "detail", widget: "text"}
              - {label: "Questions Note", name: "questionsNote", widget: "string"}
              - {label: "Questions Email", name: "questionsEmail", widget: "string"}

      - label: "Homepage"
        name: "homepage"
        file: "public/data/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Main Heading", name: "heading", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Background Image (1920x1080px recommended)", name: "backgroundImage", widget: "image", required: false}
              - label: "Primary Button"
                name: "primaryButton"
                widget: "object"
                fields:
                  - {label: "Button Text", name: "text", widget: "string"}
                  - {label: "Button Link", name: "link", widget: "string"}
              - label: "Secondary Button"
                name: "secondaryButton"
                widget: "object"
                fields:
                  - {label: "Button Text", name: "text", widget: "string"}
                  - {label: "Button Link", name: "link", widget: "string"}

          - label: "What We Offer Section"
            name: "whatWeOffer"
            widget: "object"
            fields:
              - {label: "Section Title", name: "sectionTitle", widget: "string"}
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}

          - label: "Call to Action"
            name: "callToAction"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Button Text", name: "buttonText", widget: "string"}
              - {label: "Button Link", name: "buttonLink", widget: "string"}

          - label: "Sponsors & Partners"
            name: "sponsors"
            widget: "object"
            fields:
              - {label: "Section Title", name: "sectionTitle", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Sponsors"
                name: "sponsors"
                widget: "list"
                required: false
                fields:
                  - {label: "Sponsor Name", name: "name", widget: "string"}
                  - {label: "Logo Image", name: "logo", widget: "image"}
                  - {label: "Website URL", name: "url", widget: "string", required: false}

      - label: "About Page"
        name: "about"
        file: "public/data/about.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}

          - label: "Introduction"
            name: "introduction"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}

          - label: "Mission Section"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Mission Statement", name: "statement", widget: "text"}

          - label: "What We Do"
            name: "activities"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Activities"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Activity Name", name: "name", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}

          - label: "Coaching Staff"
            name: "coaches"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - label: "Coaches"
                name: "staff"
                widget: "list"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Title/Position", name: "title", widget: "string"}
                  - {label: "Photo", name: "photo", widget: "image", required: false}
                  - {label: "Bio", name: "bio", widget: "text"}

          - label: "Officers & Board"
            name: "leadership"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - label: "Officers"
                name: "officers"
                widget: "list"
                fields:
                  - {label: "Role", name: "role", widget: "string"}
                  - {label: "Name", name: "name", widget: "string"}
              - label: "Board of Directors"
                name: "board"
                widget: "object"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Executive Director", name: "executiveDirector", widget: "string"}
                  - label: "Board Members"
                    name: "members"
                    widget: "list"
                    field: {label: "Name", name: "name", widget: "string"}

          - label: "Join Us Section"
            name: "joinUs"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}

          - label: "Sponsorship Section"
            name: "sponsorship"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Levels Heading", name: "tiersHeading", widget: "string"}
              - label: "Sponsorship Levels"
                name: "tiers"
                widget: "list"
                fields:
                  - {label: "Level Name", name: "name", widget: "string"}
                  - {label: "Amount", name: "amount", widget: "string"}
                  - {label: "Highlight as Top Tier", name: "featured", widget: "boolean", required: false, default: false}
                  - label: "Benefits"
                    name: "benefits"
                    widget: "list"
                    field: {label: "Benefit", name: "benefit", widget: "string"}
              - {label: "Footnote", name: "footnote", widget: "text", required: false}
              - {label: "Button Text", name: "ctaText", widget: "string"}
              - {label: "Button Link", name: "ctaLink", widget: "string"}

      - label: "Programs Page"
        name: "programs"
        file: "public/data/programs.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Paddling Groups"
            name: "groups"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Where We Race"
            name: "racing"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "string"}
              - label: "Races"
                name: "races"
                widget: "list"
                fields:
                  - {label: "Race Name", name: "name", widget: "string"}
                  - {label: "Location", name: "location", widget: "string"}
          - label: "What You'll Learn"
            name: "learning"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}
